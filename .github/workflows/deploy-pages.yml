name: Deploy GitHub Pages (production)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    env:
      VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        # pnpm 11 blocks native postinstall scripts by default in CI. Install
        # first without scripts, approve the exact dependency set, then rebuild
        # so Vite/esbuild/sharp/workerd binaries are available to the build.
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm approve-builds --all
          pnpm rebuild
      - name: Lint
        run: pnpm run lint
      - name: TypeScript check
        run: pnpm exec tsc --noEmit
      - name: Build production server
        run: pnpm run build
      - name: Test rendered HTML
        run: node --test tests/rendered-html.test.mjs
      - name: Build GitHub Pages mirror
        run: pnpm run build:github-pages
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: github-pages-dist
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Create immutable production tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TAG="prod-$(TZ=Asia/Shanghai date +%Y.%m.%d)-${GITHUB_SHA:0:7}"
          remote_tag_commit() {
            local remote_sha
            remote_sha="$(git ls-remote origin "refs/tags/${TAG}^{}" | awk 'NR == 1 {print $1}')"
            if [[ -z "$remote_sha" ]]; then
              remote_sha="$(git ls-remote origin "refs/tags/$TAG" | awk 'NR == 1 {print $1}')"
            fi
            printf '%s' "$remote_sha"
          }
          REMOTE_TAG_SHA="$(remote_tag_commit)"
          if [[ -n "$REMOTE_TAG_SHA" && "$REMOTE_TAG_SHA" != "$GITHUB_SHA" ]]; then
            echo "Tag $TAG already points to a different commit: $REMOTE_TAG_SHA" >&2
            exit 1
          fi
          if [[ -z "$REMOTE_TAG_SHA" ]]; then
            git tag -a "$TAG" "$GITHUB_SHA" -m "Production deployment $TAG"
            if ! git push origin "$TAG"; then
              # A concurrent run may have published the same immutable tag.
              REMOTE_TAG_SHA="$(remote_tag_commit)"
              if [[ "$REMOTE_TAG_SHA" != "$GITHUB_SHA" ]]; then
                echo "Failed to publish $TAG; remote points to: ${REMOTE_TAG_SHA:-missing}" >&2
                exit 1
              fi
              echo "Production tag $TAG was published concurrently at this commit."
            fi
          else
            echo "Production tag $TAG already exists at this commit; keeping it unchanged."
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "### Production release" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployed commit: `$GITHUB_SHA`" >> "$GITHUB_STEP_SUMMARY"
          echo "Release tag: `$TAG`" >> "$GITHUB_STEP_SUMMARY"
