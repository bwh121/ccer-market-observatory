name: Update CETS verification PDFs

on:
  schedule:
    # 20:30 Asia/Shanghai, Monday through Friday.
    - cron: "30 12 * * 1-5"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: update-cets-verification
  cancel-in-progress: false

jobs:
  refresh:
    # CETS applies a browser challenge that rejects unattended cloud runners.
    # The data collector therefore runs on an approved Windows self-hosted
    # runner with a persistent Edge profile. The workflow still fails closed:
    # incomplete candidates never replace the last validated public snapshot.
    runs-on: [self-hosted, Windows, X64, cets-collector]
    timeout-minutes: 90
    env:
      GITHUB_TOKEN: ${{ github.token }}
      CETS_PROFILE_DIR: ${{ vars.CETS_PROFILE_DIR }}
      CETS_WORK_DIR: ${{ vars.CETS_WORK_DIR || 'C:\actions-runner-ccer\cets-work' }}
      CETS_SOURCE_DIR: C:\a\cets-src-${{ github.run_id }}
      CETS_RUN_MARKER: ${{ vars.CETS_WORK_DIR || 'C:\actions-runner-ccer\cets-work' }}\.run-${{ github.run_id }}.start
      NODE_OPTIONS: --use-system-ca
    defaults:
      run:
        # Windows PowerShell is present on the collector; PowerShell Core is
        # not. Bypass applies only to each generated workflow script process.
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        working-directory: C:\a\cets-src-${{ github.run_id }}
    steps:
      - name: Prepare short source directory
        working-directory: C:\actions-runner-ccer
        run: |
          $sourceDir = [System.IO.Path]::GetFullPath($env:CETS_SOURCE_DIR)
          $allowedRoot = [System.IO.Path]::GetFullPath('C:\a')
          if (-not $sourceDir.StartsWith($allowedRoot, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "Refusing to prepare source outside $allowedRoot"
          }
          New-Item -ItemType Directory -Force -Path $sourceDir | Out-Null
          New-Item -ItemType Directory -Force -Path $env:CETS_WORK_DIR | Out-Null
          Set-Content -LiteralPath $env:CETS_RUN_MARKER -Value $env:GITHUB_RUN_ID -Encoding Ascii

          $toolNode = Get-ChildItem -Path 'C:\actions-runner-ccer\_work\_tool\node\24.*\x64\node.exe' -File -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($toolNode) {
            $nodeDir = $toolNode.DirectoryName
          } else {
            $nodeDir = 'C:\actions-runner-ccer\externals\node24\bin'
          }
          $node = Join-Path $nodeDir 'node.exe'
          if (-not (Test-Path $node)) {
            throw "Node 24 was not found on the dedicated runner"
          }
          $nodeDir | Out-File -FilePath $env:GITHUB_PATH -Append
          & $node --version

      - name: Download source snapshot through GitHub SSH
        working-directory: C:\actions-runner-ccer
        run: |
          git clone --depth 1 --filter=blob:none --no-checkout "git@github.com:$env:GITHUB_REPOSITORY.git" $env:CETS_SOURCE_DIR
          if ($LASTEXITCODE -ne 0) { throw "GitHub SSH clone failed" }
          git -C $env:CETS_SOURCE_DIR checkout --detach $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "Failed to check out $env:GITHUB_SHA" }

      - name: Set up pnpm
        run: |
          $nodeDir = Split-Path (Get-Command node.exe).Source
          $corepack = Join-Path $nodeDir 'corepack.cmd'
          if (-not (Test-Path $corepack)) {
            throw "Corepack was not found beside the runner's Node 24 installation"
          }
          & $corepack prepare pnpm@11.7.0 --activate
          & $corepack pnpm --version
          $shims = Join-Path $nodeDir 'node_modules\corepack\shims'
          if (Test-Path $shims) {
            $shims | Out-File -FilePath $env:GITHUB_PATH -Append
          }

      # The dedicated Windows collector already has Python installed. Reusing
      # it avoids changing the host's PowerShell execution policy merely so
      # setup-python can run its downloaded installer script.
      - name: Verify local Python
        run: |
          python --version
          python -c "import sys; assert sys.version_info >= (3, 12), sys.version"

      - name: Install crawler and parser dependencies
        run: |
          pnpm --virtual-store-dir C:\a\pnpm\pipeline --dir data-pipeline install --frozen-lockfile
          $edgeCandidates = @(
            "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe",
            "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe"
          )
          if (-not ($edgeCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1)) {
            throw "Microsoft Edge is required on the cets-collector runner"
          }
          python -m pip install -r data-pipeline/requirements.txt

      - name: Start dedicated Edge collector
        id: edge
        run: |
          if (-not $env:CETS_PROFILE_DIR) {
            throw "Repository variable CETS_PROFILE_DIR is required on the cets-collector runner"
          }
          $edgeCandidates = @(
            "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe",
            "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe"
          )
          $edge = $edgeCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          $edgeProcess = Start-Process -FilePath $edge -WindowStyle Hidden -PassThru -ArgumentList @(
            "--user-data-dir=$env:CETS_PROFILE_DIR",
            "--remote-debugging-port=9223",
            "--remote-allow-origins=http://127.0.0.1:9223",
            "--no-first-run",
            "--no-default-browser-check",
            "https://www.cets.org.cn/xxgk/index.jhtml"
          )
          "edge_pid=$($edgeProcess.Id)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          $ready = $false
          foreach ($attempt in 1..30) {
            try {
              Invoke-RestMethod -Uri "http://127.0.0.1:9223/json/version" -TimeoutSec 2 | Out-Null
              $ready = $true
              break
            } catch {
              Start-Sleep -Seconds 1
            }
          }
          if (-not $ready) {
            throw "Dedicated Edge collector did not expose its local debugging endpoint"
          }

      - name: Collect complete public list and PDF links
        run: |
          $workDir = $env:CETS_WORK_DIR
          New-Item -ItemType Directory -Force -Path $workDir | Out-Null
          pnpm --dir data-pipeline crawl:cets -- `
            --work-dir $workDir `
            --existing public/data/cea-verification.json `
            --cdp-endpoint http://127.0.0.1:9223 `
            --challenge-timeout-ms 120000 `
            --allow-source-missing-pdf

      - name: Parse PDFs and apply publish gate
        run: |
          $workDir = $env:CETS_WORK_DIR
          $existingArgs = @()
          if (Test-Path public/data/cea-verification.json) {
            $existingArgs = @('--existing-json', 'public/data/cea-verification.json')
          }
          python data-pipeline/parse_verification_pdfs.py `
            --manifest "$workDir/verification-pdf-manifest.json" `
            --pdf-dir "$workDir/pdfs" `
            --verification-list "$workDir/verification-list.json" `
            --output-dir "$workDir/parsed" `
            --publish-json public/data/cea-verification.json `
            --publish-table-dir public/data/exports `
            --min-coverage 1.0 `
            --allow-source-missing-pdf `
            @existingArgs

      - name: Sync validated PDF data into the dashboard
        run: pnpm --dir data-pipeline sync:cets

      - name: Run parser tests
        run: python -m unittest discover -s data-pipeline -p "test_*.py" -v

      - name: Install site dependencies
        run: |
          pnpm --virtual-store-dir C:\a\pnpm\site install --frozen-lockfile --ignore-scripts
          pnpm approve-builds --all
          pnpm rebuild

      - name: Validate site
        run: |
          pnpm run lint
          pnpm exec tsc --noEmit
          $env:WRANGLER_LOG_PATH = ".wrangler/wrangler.log"
          pnpm exec vinext build
          pnpm run build:github-pages
          node --test tests/rendered-html.test.mjs

      - name: Commit validated data changes
        id: commit
        run: python data-pipeline/github_actions_cets.py publish --root .

      - name: Close prior update alert after success
        if: success()
        run: |
          function Decode-Utf8([string]$value) { [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($value)) }
          $headers = @{ Accept = 'application/vnd.github+json'; Authorization = "Bearer $env:GITHUB_TOKEN"; 'User-Agent' = 'ccer-cets-verification-workflow'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $api = "https://api.github.com/repos/$env:GITHUB_REPOSITORY"
          $title = Decode-Utf8 'W+aVsOaNruabtOaWsF0gQ0VUUyDmoLjmn6XmnLrmnoToh6rliqjmm7TmlrDlpLHotKU='
          $issues = Invoke-RestMethod -Uri "$api/issues?state=open&per_page=100" -Headers $headers -TimeoutSec 60
          foreach ($issue in @($issues | Where-Object { $_.title -eq $title })) {
            $body = (Decode-Utf8 '6Ieq5Yqo5pu05paw5bey5LqOIA==') + [DateTime]::UtcNow.ToString('o') + (Decode-Utf8 'IOaBouWkjeW5tumAmui/h+WujOaVtOaAp+agoemqjOOAgg==')
            $comment = @{ body = $body } | ConvertTo-Json
            Invoke-RestMethod -Method Post -Uri "$api/issues/$($issue.number)/comments" -Headers $headers -Body $comment -ContentType 'application/json' -TimeoutSec 60 | Out-Null
            $close = @{ state = 'closed' } | ConvertTo-Json
            Invoke-RestMethod -Method Patch -Uri "$api/issues/$($issue.number)" -Headers $headers -Body $close -ContentType 'application/json' -TimeoutSec 60 | Out-Null
          }

      - name: Summarize diagnostics
        if: ${{ failure() || cancelled() }}
        working-directory: C:\actions-runner-ccer
        run: |
          $workDir = $env:CETS_WORK_DIR
          $runStarted = (Get-Item -LiteralPath $env:CETS_RUN_MARKER).LastWriteTimeUtc
          foreach ($path in @("$workDir\verification-list.json", "$workDir\verification-pdf-manifest.json", "$workDir\parsed\verification-pdf-quality.json")) {
            if ((Test-Path $path) -and (Get-Item -LiteralPath $path).LastWriteTimeUtc -ge $runStarted) {
              $content = Get-Content -LiteralPath $path -Raw
              "## $([IO.Path]::GetFileName($path))" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              '```json' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              $content.Substring(0, [Math]::Min(12000, $content.Length)) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            }
          }

      - name: Create or update failure alert
        if: ${{ failure() || cancelled() }}
        run: |
          function Decode-Utf8([string]$value) { [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($value)) }
          $headers = @{ Accept = 'application/vnd.github+json'; Authorization = "Bearer $env:GITHUB_TOKEN"; 'User-Agent' = 'ccer-cets-verification-workflow'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $api = "https://api.github.com/repos/$env:GITHUB_REPOSITORY"
          $title = Decode-Utf8 'W+aVsOaNruabtOaWsF0gQ0VUUyDmoLjmn6XmnLrmnoToh6rliqjmm7TmlrDlpLHotKU='
          $body = @(
            (Decode-Utf8 '6Ieq5Yqo5pu05paw5ZyoIA==') + [DateTime]::UtcNow.ToString('o') + (Decode-Utf8 'IOacqumAmui/h+OAgg==')
            ''
            (Decode-Utf8 '5Li66YG/5YWN5oqK5LiN5a6M5pW05pWw5o2u5Y+R5biD5Yiw57q/5LiK77yM5pys5qyh6L+Q6KGM5rKh5pyJ6KaG55uW5LiK5LiA54mI5pWw5o2u44CC')
            (Decode-Utf8 '6L+Q6KGM6K6w5b2V77ya') + "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          ) -join "`n"
          $qualityPath = Join-Path $env:CETS_WORK_DIR 'parsed\verification-pdf-quality.json'
          $runStarted = (Get-Item -LiteralPath $env:CETS_RUN_MARKER).LastWriteTimeUtc
          if ((Test-Path $qualityPath) -and (Get-Item -LiteralPath $qualityPath).LastWriteTimeUtc -ge $runStarted) {
            $quality = Get-Content -LiteralPath $qualityPath -Raw
            $body += "`n`n" + '```json' + "`n" + $quality.Substring(0, [Math]::Min(12000, $quality.Length)) + "`n" + '```'
          }
          $issues = Invoke-RestMethod -Uri "$api/issues?state=open&per_page=100" -Headers $headers -TimeoutSec 60
          $existing = @($issues | Where-Object { $_.title -eq $title }) | Select-Object -First 1
          if ($existing) {
            $payload = @{ body = $body } | ConvertTo-Json
            Invoke-RestMethod -Method Post -Uri "$api/issues/$($existing.number)/comments" -Headers $headers -Body $payload -ContentType 'application/json' -TimeoutSec 60 | Out-Null
          } else {
            $payload = @{ title = $title; body = $body } | ConvertTo-Json
            Invoke-RestMethod -Method Post -Uri "$api/issues" -Headers $headers -Body $payload -ContentType 'application/json' -TimeoutSec 60 | Out-Null
          }

      - name: Close dedicated Edge collector
        if: always()
        run: |
          $edgePid = "${{ steps.edge.outputs.edge_pid }}"
          if ($edgePid -match '^\d+$') {
            Stop-Process -Id ([int]$edgePid) -Force -ErrorAction SilentlyContinue
          }

      - name: Clean short source directory
        if: always()
        working-directory: C:\actions-runner-ccer
        run: |
          $sourceDir = [System.IO.Path]::GetFullPath($env:CETS_SOURCE_DIR)
          $allowedRoot = [System.IO.Path]::GetFullPath('C:\a')
          if (-not $sourceDir.StartsWith($allowedRoot, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "Refusing to remove source outside $allowedRoot"
          }
          Remove-Item -LiteralPath $sourceDir -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $env:CETS_RUN_MARKER -Force -ErrorAction SilentlyContinue
