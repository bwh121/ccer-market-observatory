name: Update CETS verification PDFs

on:
  schedule:
    # 20:30 Asia/Shanghai, Monday through Friday.
    - cron: "30 12 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: update-cets-verification
  cancel-in-progress: false

jobs:
  refresh:
    # CETS applies a browser challenge that rejects unattended cloud runners.
    # The data collector therefore runs on an approved Windows self-hosted
    # runner with a persistent Edge profile. The workflow still fails closed:
    # incomplete candidates never replace the last validated public snapshot.
    runs-on: [self-hosted, Windows, X64, cets-collector]
    timeout-minutes: 90
    env:
      CETS_PROFILE_DIR: ${{ vars.CETS_PROFILE_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # The dedicated Windows collector already has Python installed. Reusing
      # it avoids changing the host's PowerShell execution policy merely so
      # setup-python can run its downloaded installer script.
      - name: Verify local Python
        shell: pwsh
        run: |
          python --version
          python -c "import sys; assert sys.version_info >= (3, 12), sys.version"

      - name: Install crawler and parser dependencies
        shell: pwsh
        run: |
          pnpm --dir data-pipeline install --frozen-lockfile
          $edgeCandidates = @(
            "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe",
            "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe"
          )
          if (-not ($edgeCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1)) {
            throw "Microsoft Edge is required on the cets-collector runner"
          }
          python -m pip install -r data-pipeline/requirements.txt

      - name: Collect complete public list and PDF links
        shell: pwsh
        run: |
          if (-not $env:CETS_PROFILE_DIR) {
            throw "Repository variable CETS_PROFILE_DIR is required on the cets-collector runner"
          }
          pnpm --dir data-pipeline crawl:cets -- `
            --work-dir work/cets-verification `
            --existing public/data/cea-verification.json `
            --channel msedge `
            --profile-dir $env:CETS_PROFILE_DIR `
            --challenge-timeout-ms 120000

      - name: Parse PDFs and apply publish gate
        shell: pwsh
        run: |
          $existingArgs = @()
          if (Test-Path public/data/cea-verification.json) {
            $existingArgs = @('--existing-json', 'public/data/cea-verification.json')
          }
          python data-pipeline/parse_verification_pdfs.py `
            --manifest work/cets-verification/verification-pdf-manifest.json `
            --pdf-dir work/cets-verification/pdfs `
            --verification-list work/cets-verification/verification-list.json `
            --output-dir work/cets-verification/parsed `
            --publish-json public/data/cea-verification.json `
            --publish-table-dir public/data/exports `
            --min-coverage 1.0 `
            @existingArgs

      - name: Sync validated PDF data into the dashboard
        run: pnpm --dir data-pipeline sync:cets

      - name: Run parser tests
        run: python -m unittest discover -s data-pipeline -p "test_*.py" -v

      - name: Install site dependencies
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm approve-builds --all
          pnpm rebuild

      - name: Validate site
        shell: pwsh
        run: |
          pnpm run lint
          pnpm exec tsc --noEmit
          pnpm run build:github-pages
          node --test tests/rendered-html.test.mjs

      - name: Commit validated data changes
        id: commit
        shell: pwsh
        run: |
          git diff --quiet -- public/data
          if ($LASTEXITCODE -eq 0) {
            "changed=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/cea-dashboard.json public/data/cea-participants.json public/data/cea-verification.json public/data/exports
          git commit -m "data: refresh CETS verification PDFs"
          git push origin HEAD:main
          "changed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Close prior update alert after success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "[数据更新] CETS 核查机构自动更新失败";
            const { data } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            for (const issue of data.filter((item) => item.title === title)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `自动更新已于 ${new Date().toISOString()} 恢复并通过完整性校验。`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
              });
            }

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cets-verification-diagnostics-${{ github.run_id }}
          path: work/cets-verification
          if-no-files-found: ignore
          retention-days: 14

      - name: Create or update failure alert
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "[数据更新] CETS 核查机构自动更新失败";
            const body = [
              `自动更新在 ${new Date().toISOString()} 未通过。`,
              "",
              "为避免把不完整数据发布到线上，本次运行没有覆盖上一版数据。",
              `运行记录：${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join("\n");
            const { data } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = data.find((item) => item.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
