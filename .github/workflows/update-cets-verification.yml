name: Update CETS verification PDFs

on:
  # Temporary smoke-test trigger. Removed after the end-to-end production
  # refresh succeeds; the permanent automation remains schedule + manual.
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-cets-verification.yml"
  schedule:
    # 20:30 Asia/Shanghai, Monday through Friday.
    - cron: "30 12 * * 1-5"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: update-cets-verification
  cancel-in-progress: false

jobs:
  refresh:
    # CETS applies a browser challenge that rejects unattended cloud runners.
    # The data collector therefore runs on an approved Windows self-hosted
    # runner with a persistent Edge profile. The workflow still fails closed:
    # incomplete candidates never replace the last validated public snapshot.
    runs-on: [self-hosted, Windows, X64, cets-collector]
    timeout-minutes: 90
    env:
      CETS_PROFILE_DIR: ${{ vars.CETS_PROFILE_DIR }}
      CETS_WORK_DIR: ${{ vars.CETS_WORK_DIR || 'C:\actions-runner-ccer\cets-work' }}
      CETS_SOURCE_DIR: C:\a\cets-src-${{ github.run_id }}
      NODE_OPTIONS: --use-system-ca
    defaults:
      run:
        # Windows PowerShell is present on the collector; PowerShell Core is
        # not. Bypass applies only to each generated workflow script process.
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        working-directory: C:\a\cets-src-${{ github.run_id }}
    steps:
      - name: Prepare short source directory
        working-directory: C:\actions-runner-ccer
        run: |
          $sourceDir = [System.IO.Path]::GetFullPath($env:CETS_SOURCE_DIR)
          $allowedRoot = [System.IO.Path]::GetFullPath('C:\a')
          if (-not $sourceDir.StartsWith($allowedRoot, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "Refusing to prepare source outside $allowedRoot"
          }
          New-Item -ItemType Directory -Force -Path $sourceDir | Out-Null

      - name: Download source snapshot through GitHub API
        uses: actions/github-script@v7
        with:
          retries: 3
          script: |
            const fs = require("fs");
            const path = require("path");
            const root = process.env.CETS_SOURCE_DIR;
            const { data: commit } = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
            });
            const { data: tree } = await github.rest.git.getTree({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tree_sha: commit.commit.tree.sha,
              recursive: "true",
            });
            if (tree.truncated) throw new Error("GitHub source tree was truncated");
            const files = tree.tree.filter((item) => item.type === "blob" && item.path);
            for (const item of files) {
              const { data: blob } = await github.rest.git.getBlob({
                owner: context.repo.owner,
                repo: context.repo.repo,
                file_sha: item.sha,
              });
              const destination = path.join(root, ...item.path.split("/"));
              fs.mkdirSync(path.dirname(destination), { recursive: true });
              fs.writeFileSync(destination, Buffer.from(blob.content.replace(/\n/g, ""), "base64"));
            }
            core.info(`Materialized ${files.length} source files for ${context.sha}.`);

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # The dedicated Windows collector already has Python installed. Reusing
      # it avoids changing the host's PowerShell execution policy merely so
      # setup-python can run its downloaded installer script.
      - name: Verify local Python
        run: |
          python --version
          python -c "import sys; assert sys.version_info >= (3, 12), sys.version"

      - name: Install crawler and parser dependencies
        run: |
          pnpm --virtual-store-dir C:\a\pnpm\pipeline --dir data-pipeline install --frozen-lockfile
          $edgeCandidates = @(
            "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe",
            "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe"
          )
          if (-not ($edgeCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1)) {
            throw "Microsoft Edge is required on the cets-collector runner"
          }
          python -m pip install -r data-pipeline/requirements.txt

      - name: Start dedicated Edge collector
        id: edge
        run: |
          if (-not $env:CETS_PROFILE_DIR) {
            throw "Repository variable CETS_PROFILE_DIR is required on the cets-collector runner"
          }
          $edgeCandidates = @(
            "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe",
            "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe"
          )
          $edge = $edgeCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          $edgeProcess = Start-Process -FilePath $edge -WindowStyle Hidden -PassThru -ArgumentList @(
            "--user-data-dir=$env:CETS_PROFILE_DIR",
            "--remote-debugging-port=9223",
            "--remote-allow-origins=http://127.0.0.1:9223",
            "--no-first-run",
            "--no-default-browser-check",
            "https://www.cets.org.cn/xxgk/index.jhtml"
          )
          "edge_pid=$($edgeProcess.Id)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          $ready = $false
          foreach ($attempt in 1..30) {
            try {
              Invoke-RestMethod -Uri "http://127.0.0.1:9223/json/version" -TimeoutSec 2 | Out-Null
              $ready = $true
              break
            } catch {
              Start-Sleep -Seconds 1
            }
          }
          if (-not $ready) {
            throw "Dedicated Edge collector did not expose its local debugging endpoint"
          }

      - name: Collect complete public list and PDF links
        run: |
          $workDir = $env:CETS_WORK_DIR
          New-Item -ItemType Directory -Force -Path $workDir | Out-Null
          pnpm --dir data-pipeline crawl:cets -- `
            --work-dir $workDir `
            --existing public/data/cea-verification.json `
            --cdp-endpoint http://127.0.0.1:9223 `
            --challenge-timeout-ms 120000 `
            --allow-source-missing-pdf

      - name: Parse PDFs and apply publish gate
        run: |
          $workDir = $env:CETS_WORK_DIR
          $existingArgs = @()
          if (Test-Path public/data/cea-verification.json) {
            $existingArgs = @('--existing-json', 'public/data/cea-verification.json')
          }
          python data-pipeline/parse_verification_pdfs.py `
            --manifest "$workDir/verification-pdf-manifest.json" `
            --pdf-dir "$workDir/pdfs" `
            --verification-list "$workDir/verification-list.json" `
            --output-dir "$workDir/parsed" `
            --publish-json public/data/cea-verification.json `
            --publish-table-dir public/data/exports `
            --min-coverage 1.0 `
            --allow-source-missing-pdf `
            @existingArgs

      - name: Sync validated PDF data into the dashboard
        run: pnpm --dir data-pipeline sync:cets

      - name: Run parser tests
        run: python -m unittest discover -s data-pipeline -p "test_*.py" -v

      - name: Install site dependencies
        run: |
          pnpm --virtual-store-dir C:\a\pnpm\site install --frozen-lockfile --ignore-scripts
          pnpm approve-builds --all
          pnpm rebuild

      - name: Validate site
        run: |
          pnpm run lint
          pnpm exec tsc --noEmit
          $env:WRANGLER_LOG_PATH = ".wrangler/wrangler.log"
          pnpm exec vinext build
          pnpm run build:github-pages
          node --test tests/rendered-html.test.mjs

      - name: Commit validated data changes
        id: commit
        uses: actions/github-script@v7
        with:
          retries: 3
          script: |
            const fs = require("fs");
            const path = require("path");
            const root = process.env.CETS_SOURCE_DIR;
            const candidatePaths = [
              "public/data/cea-dashboard.json",
              "public/data/cea-participants.json",
              "public/data/cea-verification.json",
              "public/data/exports/verification-details.csv",
              "public/data/exports/verification-pdf-quality.json",
              "public/data/exports/verification-targets.csv",
            ];
            const changedPaths = [];
            for (const filePath of candidatePaths) {
              const localContent = fs.readFileSync(path.join(root, ...filePath.split("/")));
              const localSha = require("crypto").createHash("sha1")
                .update(Buffer.concat([Buffer.from(`blob ${localContent.length}\0`), localContent]))
                .digest("hex");
              const { data: remoteFile } = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: filePath,
                ref: "main",
              });
              if (Array.isArray(remoteFile) || remoteFile.type !== "file") {
                throw new Error(`Expected a file at ${filePath}`);
              }
              if (remoteFile.sha !== localSha) changedPaths.push(filePath);
            }
            if (changedPaths.length === 0) {
              core.setOutput("changed", "false");
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const blobs = [];
            for (const filePath of changedPaths) {
              const content = fs.readFileSync(path.join(root, ...filePath.split("/"))).toString("base64");
              const { data: blob } = await github.rest.git.createBlob({
                owner,
                repo,
                content,
                encoding: "base64",
              });
              blobs.push({ path: filePath, mode: "100644", type: "blob", sha: blob.sha });
            }

            for (let attempt = 1; attempt <= 3; attempt += 1) {
              const { data: branchRef } = await github.rest.git.getRef({
                owner,
                repo,
                ref: "heads/main",
              });
              const parentSha = branchRef.object.sha;
              const { data: parentCommit } = await github.rest.git.getCommit({
                owner,
                repo,
                commit_sha: parentSha,
              });
              const { data: tree } = await github.rest.git.createTree({
                owner,
                repo,
                base_tree: parentCommit.tree.sha,
                tree: blobs,
              });
              const { data: commit } = await github.rest.git.createCommit({
                owner,
                repo,
                message: "data: refresh CETS verification PDFs",
                tree: tree.sha,
                parents: [parentSha],
              });
              try {
                await github.rest.git.updateRef({
                  owner,
                  repo,
                  ref: "heads/main",
                  sha: commit.sha,
                  force: false,
                });
                await github.rest.actions.createWorkflowDispatch({
                  owner,
                  repo,
                  workflow_id: "deploy-pages.yml",
                  ref: "main",
                });
                core.setOutput("changed", "true");
                core.info(`Published ${changedPaths.length} validated data files in ${commit.sha} and dispatched production deployment.`);
                return;
              } catch (error) {
                const retryableRace = error.status === 409 || error.status === 422;
                if (!retryableRace || attempt === 3) throw error;
                core.warning(`main advanced during publish; rebuilding the data commit (attempt ${attempt + 1}/3).`);
              }
            }

      - name: Close prior update alert after success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "[数据更新] CETS 核查机构自动更新失败";
            const { data } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            for (const issue of data.filter((item) => item.title === title)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `自动更新已于 ${new Date().toISOString()} 恢复并通过完整性校验。`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
              });
            }

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cets-verification-diagnostics-${{ github.run_id }}
          path: |
            ${{ vars.CETS_WORK_DIR || 'C:\actions-runner-ccer\cets-work' }}\verification-list.json
            ${{ vars.CETS_WORK_DIR || 'C:\actions-runner-ccer\cets-work' }}\verification-pdf-manifest.json
            ${{ vars.CETS_WORK_DIR || 'C:\actions-runner-ccer\cets-work' }}\parsed\verification-pdf-quality.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Create or update failure alert
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "[数据更新] CETS 核查机构自动更新失败";
            const body = [
              `自动更新在 ${new Date().toISOString()} 未通过。`,
              "",
              "为避免把不完整数据发布到线上，本次运行没有覆盖上一版数据。",
              `运行记录：${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join("\n");
            const { data } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = data.find((item) => item.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }

      - name: Close dedicated Edge collector
        if: always()
        run: |
          $edgePid = "${{ steps.edge.outputs.edge_pid }}"
          if ($edgePid -match '^\d+$') {
            Stop-Process -Id ([int]$edgePid) -Force -ErrorAction SilentlyContinue
          }

      - name: Clean short source directory
        if: always()
        working-directory: C:\actions-runner-ccer
        run: |
          $sourceDir = [System.IO.Path]::GetFullPath($env:CETS_SOURCE_DIR)
          $allowedRoot = [System.IO.Path]::GetFullPath('C:\a')
          if (-not $sourceDir.StartsWith($allowedRoot, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "Refusing to remove source outside $allowedRoot"
          }
          Remove-Item -LiteralPath $sourceDir -Recurse -Force -ErrorAction SilentlyContinue
